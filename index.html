<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Controle financeiro do casal: gastos no débito e no crédito, investimentos e patrimônio.">
<meta name="theme-color" content="#0d1117">
<meta name="color-scheme" content="dark light">
<title>Finanças do Casal</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/charts.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

<!-- ============ TELA DE BLOQUEIO ============ -->
<div id="lock" class="lock" hidden>
  <div class="lock__bg" aria-hidden="true">
    <svg viewBox="0 0 1200 600" preserveAspectRatio="none"><path id="lockWave" d="" /></svg>
  </div>
  <main class="lock__card" role="main">
    <div class="lock__brand">
      <svg class="lock__logo" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 42s-15-9.2-15-20a8.6 8.6 0 0 1 15-5.7A8.6 8.6 0 0 1 39 22c0 10.8-15 20-15 20Z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M14 26h6l3-6 4 11 3-5h6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1 class="lock__title">Finanças do Casal</h1>
        <p class="lock__sub" id="lockSub">Entre para ver os painéis</p>
      </div>
    </div>
    <div id="lockBody"></div>
    <p class="lock__foot">
      <svg viewBox="0 0 24 24" class="ico" aria-hidden="true"><path d="M6 10V8a6 6 0 1 1 12 0v2m-13 0h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Seus dados ficam só neste aparelho, neste navegador.
    </p>
  </main>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <button class="topbar__brand" id="btnHome" title="Visão geral">
      <svg class="topbar__logo" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 42s-15-9.2-15-20a8.6 8.6 0 0 1 15-5.7A8.6 8.6 0 0 1 39 22c0 10.8-15 20-15 20Z" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/>
        <path d="M14 26h6l3-6 4 11 3-5h6" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="topbar__name" id="coupleName">Nosso dinheiro</span>
    </button>

    <div class="monthnav" id="monthNav">
      <button class="monthnav__btn" id="mPrev" aria-label="Mês anterior">
        <svg viewBox="0 0 24 24" class="ico"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="monthnav__label" id="mLabel" aria-haspopup="dialog">setembro 2026</button>
      <button class="monthnav__btn" id="mNext" aria-label="Próximo mês">
        <svg viewBox="0 0 24 24" class="ico"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="topbar__actions">
      <button class="iconbtn" id="btnAdd" title="Novo lançamento (N)">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="iconbtn__txt">Lançar</span>
      </button>
      <button class="iconbtn iconbtn--ghost" id="btnInbox" title="Caixa de entrada do WhatsApp">
        <svg viewBox="0 0 24 24" class="ico"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3.5 20.5l1.7-5A8.5 8.5 0 1 1 21 11.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="badge" id="inboxBadge" hidden>0</span>
      </button>
      <button class="iconbtn iconbtn--ghost nuvem-ind" id="btnNuvem" title="Sincronização" data-estado="desligado" hidden>
        <svg viewBox="0 0 24 24" class="ico"><path d="M7 18h10.5a4.5 4.5 0 0 0 .6-8.96A6 6 0 0 0 6.6 10.1 4 4 0 0 0 7 18Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span class="nuvem-ind__dot"></span>
      </button>
      <button class="iconbtn iconbtn--ghost" id="btnTheme" title="Tema claro/escuro">
        <svg viewBox="0 0 24 24" class="ico ico-sun"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" class="ico ico-moon"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.5 8.5 0 1 0 20 14.2Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
      </button>
      <button class="iconbtn iconbtn--ghost" id="btnLock" title="Bloquear">
        <svg viewBox="0 0 24 24" class="ico"><path d="M6 10V8a6 6 0 1 1 12 0v2m-13 0h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Seções"></nav>

  <main class="main" id="view" tabindex="-1"></main>

  <nav class="bottomnav" id="bottomNav" aria-label="Navegação"></nav>

  <button class="fab" id="fab" aria-label="Novo lançamento">
    <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" aria-live="polite"></div>
<div id="printRoot" class="printroot"></div>

<script src="js/format.js"></script>
<script src="js/dom.js"></script>
<script src="js/crypto.js"></script>
<script src="js/parser.js"></script>
<script src="js/merge.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/model.js"></script>
<script src="js/ui.js"></script>
<script src="js/charts.js"></script>
<script src="js/indicators.js"></script>
<script src="js/sync.js"></script>
<script src="js/nuvem-config.js"></script>
<script src="js/nuvem.js"></script>
<script src="js/pdf.js"></script>
<script src="js/forms.js"></script>
<script src="js/views/login.js"></script>
<script src="js/views/overview.js"></script>
<script src="js/views/person.js"></script>
<script src="js/views/forecast.js"></script>
<script src="js/views/invest.js"></script>
<script src="js/views/reports.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/inbox.js"></script>
<script src="js/app.js"></script>
</body>
</html>
